metadata:
  name: alb
spec:
  controller: ingress.k8s.aws/alb
---
# THE ING RES FOR NGINX SERVICE SNDF DEPL AND FOR AWS LBC ALB PROVISIOING HAS BEEN ADDED
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress-ip
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: mmmm-alb-ip-mode
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/subnets: subnet-0a74bcbfbb7e8dc8b,subnet-00d9de26b3f0a0544
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-west-2:992382812472:certificate/dc9d596e-58f7-414c-a7cd-c2e091a7b5ad"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-1-2017-01
    alb.ingress.kubernetes.io/ip-address-type: ipv4
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: ajmalkhan.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 80
    - host: www.ajmalkhan.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 80
    - host: backend.ajmalkhan.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-app-service
                port:
                  number: 80
